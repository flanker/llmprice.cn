plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-seo-tag and jekyll-sitemap both need an absolute base to build
# canonical URLs and sitemap entries from.
url: https://llmprice.cn
title: llmprice.cn
# jekyll-seo-tag stamps og:locale from this and defaults to en_US otherwise,
# which would mislabel a zh-CN site to crawlers and social previews.
lang: zh-CN
description: >
  按厂商分组对比 OpenAI、Anthropic、Google、DeepSeek、通义千问、Kimi、智谱、
  MiniMax 等主流大模型的 API 输入与输出价格。数据取自 LiteLLM 官方成本表，
  价格以元/百万 Token 计。

google_analytics: G-WZ0K1GPGHJ

feed:
  path: https://github.com/flanker/llmprice.cn

titles_from_headings:
  strip_title: true

# Repo docs are not site content; without this they ship as
# llmprice.cn/README.md and llmprice.cn/CLAUDE.md.
exclude:
  - README.md
  - CLAUDE.md
  - tools/
